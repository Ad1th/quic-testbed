# TEMPLATE: scripts/testbed.sh replaces @PROJECT@ (this repo) and @HOME@ ($HOME) and writes logs/nginx.rendered.conf.
daemon off;
user root;
worker_processes 1;
error_log @PROJECT@/logs/nginx-error.log notice;
events { worker_connections 1024; }
http {
  access_log off;
  sendfile on;
  server {
    listen 10.0.0.2:443 quic reuseport;
    listen 10.0.0.2:443 ssl;
    http2 on;
    server_name 10.0.0.2;
    ssl_certificate     @HOME@/srv/certs/server.crt;
    ssl_certificate_key @HOME@/srv/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    http3_stream_buffer_size 8m;
    root @HOME@/srv/content;
  }
}
